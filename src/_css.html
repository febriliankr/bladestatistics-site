<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0b0c;
    --fg: #ededee;
    --muted: #8b8b90;
    --dim: #6a6a70;
    --line: #232326;
    --panel: #131315;
    --panel-2: #17171a;
    --hover: #1c1c1f;
    --code-bg: #1a1a1d;
    --brand: #ff4900;
    /* brand orange on white is too weak for small text, so text and buttons
       get their own darker value in light mode */
    --brand-ink: #ff5c1a;
    --brand-btn: #ff4900;
    --brand-btn-hover: #ff6326;
    --brand-wash: rgba(255, 73, 0, .035);
    --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  }

  /* the page follows the device: same layout, two palettes */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --fg: #17171a;
      --muted: #5d5d64;
      --dim: #85858c;
      --line: #e4e4e6;
      --panel: #f8f8f7;
      --panel-2: #f2f2f1;
      --hover: #eeeeed;
      --code-bg: #f0f0ee;
      --brand: #ff4900;
      --brand-ink: #c03700;
      --brand-btn: #d13c00;
      --brand-btn-hover: #b93500;
      --brand-wash: rgba(255, 73, 0, .05);
      --shadow: 0 12px 32px rgba(0, 0, 0, .12);
    }
    /* thinning the strokes helps on a dark ground and hurts on a light one */
    body { -webkit-font-smoothing: auto; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
      "Hiragino Sans", "Yu Gothic UI", "Malgun Gothic", "PingFang SC",
      "Microsoft YaHei", "Noto Sans", "Nirmala UI", "Geeza Pro", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  /* ---- header / hero ---- */
  header { padding: 88px 0 0; }
  .logo { width: 56px; height: 56px; border-radius: 13px; display: block; }
  h1 {
    margin-top: 30px;
    font-size: clamp(34px, 6vw, 52px);
    line-height: 1.06;
    letter-spacing: -.035em;
    font-weight: 640;
    margin: 0 0 18px;
    max-width: 15ch;
  }
  h1 em { font-style: normal; color: var(--brand-ink); }
  .lede { font-size: 18.5px; color: var(--muted); margin: 0 0 32px; max-width: 54ch; }

  .btn {
    display: inline-block;
    background: var(--brand-btn);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 550;
    padding: 11px 22px;
    border-radius: 9px;
    transition: background .16s ease, transform .16s ease;
  }
  .btn:hover { background: var(--brand-btn-hover); }
  .btn:active { transform: translateY(1px); }

  /* adaptive CTA: primary button + variant dropdown */
  .cta { position: relative; display: inline-flex; align-items: stretch; gap: 2px; vertical-align: middle; }
  .cta .btn {
    border-start-start-radius: 9px;
    border-end-start-radius: 9px;
    border-start-end-radius: 0;
    border-end-end-radius: 0;
  }
  .cta .btn:only-child { border-radius: 9px; }
  /* .cta .btn outranks a bare .caret rule, so this selector has to match it. */
  .cta .caret {
    border: 0;
    cursor: pointer;
    padding: 0 12px;
    display: flex;
    align-items: center;
    border-start-start-radius: 0;
    border-end-start-radius: 0;
    border-start-end-radius: 9px;
    border-end-end-radius: 9px;
  }
  .caret svg { width: 10px; height: 6px; fill: #fff; transition: transform .18s ease; }
  .caret[aria-expanded="true"] svg { transform: rotate(180deg); }
  .cta-menu {
    position: absolute;
    top: calc(100% + 6px);
    inset-inline-start: 0;
    z-index: 10;
    min-width: 290px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel);
    box-shadow: var(--shadow);
    transform-origin: top left;
    animation: menuIn .16s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-6px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  .cta-menu a {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border-radius: 7px;
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    transition: background .13s ease;
  }
  .cta-menu a:hover { background: var(--hover); }
  .cta-menu svg { width: 15px; height: 15px; fill: currentColor; color: var(--muted); flex: none; }
  .cta-menu a:hover svg { color: var(--fg); }
  .cta-menu .meta { margin-inline-start: auto; font-size: 12px; color: var(--muted); }
  .note { color: var(--muted); font-size: 14px; margin-inline-start: 16px; }

  /* ---- screenshot ---- */
  .shot {
    margin: 52px auto 0;
    max-width: 880px;
    padding: 0 24px;
  }
  .shot figure {
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
    line-height: 0;
  }
  .shot img { width: 100%; height: auto; display: block; }
  .shot figcaption {
    line-height: 1.6;
    margin-top: 12px;
    font-size: 13px;
    color: var(--dim);
    text-align: center;
  }

  /* ---- facts band ---- */
  .facts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    margin: 56px 0 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--line);
  }
  .facts div { background: var(--panel); padding: 22px 20px; }
  .facts b { display: block; font-size: 26px; font-weight: 620; letter-spacing: -.02em; }
  .facts span { display: block; font-size: 13.5px; color: var(--muted); margin-top: 3px; }

  /* ---- sections ---- */
  section { padding: 80px 0 0; }
  h2 {
    font-size: clamp(24px, 3.4vw, 30px);
    line-height: 1.15;
    letter-spacing: -.025em;
    font-weight: 620;
    margin: 0 0 12px;
  }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 26px; max-width: 56ch; }

  /* ---- comparison table ---- */
  .cmp-scroll { overflow-x: auto; }
  table.cmp {
    width: 100%;
    min-width: 520px;
    border-collapse: collapse;
    font-size: 14.5px;
  }
  table.cmp th, table.cmp td {
    text-align: start;
    padding: 15px 16px;
    border-top: 1px solid var(--line);
    vertical-align: top;
  }
  table.cmp thead th {
    border-top: 0;
    padding-top: 0;
    font-size: 13px;
    color: var(--dim);
    font-weight: 500;
  }
  table.cmp thead th:last-child { color: var(--brand-ink); }
  table.cmp td:first-child { color: var(--fg); width: 27%; font-weight: 550; }
  table.cmp td:nth-child(2) { color: var(--dim); width: 36%; }
  table.cmp td:last-child { color: var(--muted); }
  table.cmp td:last-child { background: var(--brand-wash); }

  /* ---- steps ---- */
  .steps { counter-reset: s; margin: 0; padding: 0; list-style: none; }
  .steps li {
    counter-increment: s;
    position: relative;
    padding: 24px 0;
    padding-inline-start: 46px;
    border-top: 1px solid var(--line);
  }
  .steps li::before {
    content: counter(s);
    position: absolute;
    inset-inline-start: 0;
    top: 24px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .steps h3 { font-size: 16.5px; font-weight: 600; margin: 0 0 5px; letter-spacing: -.01em; }
  .steps p { margin: 0; color: var(--muted); font-size: 15px; }

  .quote {
    margin: 14px 0 0;
    padding: 13px 15px;
    border-inline-start: 2px solid var(--brand);
    background: var(--panel);
    border-start-end-radius: 8px;
    border-end-end-radius: 8px;
    color: var(--fg);
    font-size: 14.5px;
  }

  /* ---- method chips ---- */
  .fam { padding: 20px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 150px 1fr; gap: 18px; }
  .fam h3 { margin: 2px 0 0; font-size: 14px; font-weight: 600; color: var(--fg); letter-spacing: -.005em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span {
    font-size: 12.5px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 9px;
    line-height: 1.5;
  }

  /* ---- generic points ---- */
  .point { padding: 26px 0; border-top: 1px solid var(--line); }
  .point h3 { font-size: 16.5px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  .point p { margin: 0; color: var(--muted); font-size: 15px; }
  .point p + p { margin-top: 10px; }

  /* ---- callout ---- */
  .cross {
    margin-top: 30px;
    padding: 24px 22px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }
  .cross h3 { margin: 0 0 6px; font-size: 17px; font-weight: 620; }
  .cross p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .cross a { color: var(--brand-ink); text-decoration: none; font-weight: 550; font-size: 15px; }
  .cross a:hover { text-decoration: underline; }

  /* ---- downloads ---- */
  .get { padding: 80px 0 0; }
  .get .sub { margin-bottom: 22px; }
  .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dl a {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--fg);
    text-decoration: none;
    transition: border-color .16s ease, background .16s ease;
  }
  .dl a:hover { border-color: var(--brand); background: var(--panel-2); }
  .dl .os { font-size: 15px; font-weight: 550; display: flex; align-items: center; gap: 9px; }
  .dl svg { width: 16px; height: 16px; fill: currentColor; color: var(--muted); flex: none; transition: color .16s ease; }
  .dl a:hover svg { color: var(--fg); }
  .dl .meta { font-size: 13px; color: var(--muted); margin-inline-start: auto; }
  .caveat { color: var(--muted); font-size: 13px; margin: 18px 0 0; }
  .caveat b { color: var(--fg); font-weight: 550; }

  /* ---- faq ---- */
  .faq details {
    border-top: 1px solid var(--line);
    padding: 16px 0;
  }
  .faq summary {
    cursor: pointer;
    list-style: none;
    font-size: 15.5px;
    font-weight: 550;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::before {
    content: "+";
    color: var(--brand-ink);
    font-weight: 500;
    width: 12px;
    flex: none;
  }
  .faq details[open] summary::before { content: "\2212"; }
  /* scoped to details so it cannot catch anything else in the section */
  .faq details p { margin: 10px 0 0; margin-inline-start: 22px; color: var(--muted); font-size: 15px; }

  footer {
    margin-top: 72px;
    padding: 28px 0 72px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: center;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--fg); }
  footer .spacer { margin-inline-start: auto; }


  /* ---- top bar and language switcher ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .lang { position: relative; }
  .lang summary {
    list-style: none;
    cursor: pointer;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color .16s ease;
  }
  .lang summary::-webkit-details-marker { display: none; }
  .lang summary:hover { color: var(--fg); }
  .lang summary svg { width: 13px; height: 13px; fill: currentColor; flex: none; }
  .lang-menu {
    position: absolute;
    top: calc(100% + 10px);
    inset-inline-end: 0;
    z-index: 20;
    width: 190px;
    max-height: 300px;
    overflow-y: auto;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  .lang-menu a {
    display: block;
    padding: 7px 10px;
    border-radius: 7px;
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    transition: background .13s ease;
  }
  .lang-menu a:hover { background: var(--hover); }
  .lang-menu a[aria-current="true"] { color: var(--brand-ink); }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
    color: var(--fg);
    background: var(--code-bg);
    border: 1px solid var(--line);
    padding: 1px 5px;
    border-radius: 5px;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 640px) {
    header { padding-top: 56px; }
    h1 { max-width: none; }
    .note { display: block; margin: 14px 0 0; }
    .dl { grid-template-columns: 1fr; }
    .facts { grid-template-columns: 1fr; }
    .fam { grid-template-columns: 1fr; gap: 10px; }
    .shot { padding: 0 16px; }

    /* The two-column comparison would need sideways scrolling here, so each
       row becomes a small card with its own column labels instead. */
    table.cmp { min-width: 0; }
    table.cmp thead { display: none; }
    table.cmp tbody tr { display: block; padding: 20px 0; border-top: 1px solid var(--line); }
    table.cmp td { display: block; border: 0; padding: 0; }
    /* the desktop percentage widths would keep these columns narrow */
    table.cmp td:first-child,
    table.cmp td:nth-child(2) { width: auto; }
    table.cmp td:first-child { font-size: 16px; margin-bottom: 10px; }
    table.cmp td:nth-child(2)::before,
    table.cmp td:last-child::before {
      display: block;
      font-size: 13px;
      margin-bottom: 1px;
    }
    table.cmp td:nth-child(2)::before { content: "Point-and-click"; color: var(--dim); }
    table.cmp td:last-child::before { content: "Blade"; color: var(--brand-ink); }
    table.cmp td:last-child { background: none; margin-top: 12px; }
  }
</style>
