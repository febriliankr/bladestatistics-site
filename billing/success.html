    <p class="lead" id="msg">Thank you! Pro is active on the email you paid with. Download Blade, then sign in with that same email to use it.</p>

<script>
// A web checkout returns with ?ref=<checkout reference>, which doubles as the
// Meta event id the server-side Purchase uses, so the two dedupe. The desktop
// app's checkout returns without one.
(function () {
  var m = (location.search.match(/[?&]ref=([^&]+)/) || [])[1];
  var ref = "";
  try { ref = m ? decodeURIComponent(m) : ""; } catch (e) {}
  if (!/^[A-Za-z0-9._-]{1,128}$/.test(ref)) ref = "";
  if (ref && typeof fbq === "function")
    fbq("track", "Purchase", { value: 299000, currency: "IDR" }, { eventID: ref });
  if (ref) return;
  document.getElementById("t").textContent = "Payment received";
  document.getElementById("msg").innerHTML =
    "Return to <strong>Blade Desktop</strong>. Pro activates there automatically as soon as Xendit confirms the payment.";
  document.getElementById("actions").hidden = true;
})();
</script>
